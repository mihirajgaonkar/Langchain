[project]
name = "travel-weather-agent"
version = "0.1.0"
description = "Beginner-friendly Travel + Weather AI Agent built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Travel Weather Agent Contributors" }
]
dependencies = [
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
travel-weather-agent = "travel_weather_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_weather_agent"]
artifacts = ["src/travel_weather_agent/data/destinations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
